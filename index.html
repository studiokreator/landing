<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A space on the web.</title>
  <meta name="description" content="This domain is not currently hosting a website.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F5F2EC">
  <meta property="og:type" content="website">
  <meta property="og:title" content="A space on the web.">
  <meta property="og:description" content="This domain is not currently hosting a website.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ccircle%20cx='16'%20cy='16'%20r='7'%20fill='%238C6F4E'/%3E%3C/svg%3E">
  <style>
    /* Customization tokens. Changing these is the only edit a fork needs. */
    :root {
      --paper: #F5F2EC;
      --paper-top: #FAF8F3;
      --ink: #171613;
      --muted: #6B665C;
      --muted-soft: #706A5F;
      --line: #CFC8BA;
      --wave-line: #8B8274;
      --accent: #8C6F4E;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color-scheme: light;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 5vw, 4.5rem);
      background-color: var(--paper);
      background-image: linear-gradient(180deg, var(--paper-top), var(--paper) 72%);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      position: relative;
    }

    /* Decorative background waves. */
    .waves-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0.28;
      pointer-events: none;
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.45) 30%, #000 58%, #000 78%, transparent 100%);
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.45) 30%, #000 58%, #000 78%, transparent 100%);
    }

    .waves-bg svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .wave-gradient stop {
      stop-color: var(--wave-line);
    }

    .wave-gradient-accent stop {
      stop-color: var(--accent);
    }

    .wave-1,
    .wave-5 {
      opacity: 0.9;
    }

    .wave-3 {
      opacity: 0.8;
    }

    /* A whisper of paper grain. Purely decorative, no network request. */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.022;
      background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }

    /* Hairline descending from the top edge, ending in a single dot. */
    .mark {
      position: fixed;
      top: 0;
      left: 50%;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateX(-50%);
    }

    .mark::before {
      content: "";
      width: 1px;
      height: clamp(2.5rem, 8vh, 5.5rem);
      background: linear-gradient(to bottom, rgba(207, 200, 186, 0) 0%, var(--line) 22%, var(--line) 100%);
      transform-origin: top center;
    }

    .mark::after {
      content: "";
      width: 5px;
      height: 5px;
      margin-top: 0.5rem;
      border-radius: 50%;
      background: var(--accent);
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 62rem;
      text-align: center;
      transform: translateY(-2vh);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 7.2vw, 7rem);
      font-weight: 500;
      line-height: 1.02;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .lede {
      margin: clamp(1.25rem, 2.6vw, 2rem) auto 0;
      color: var(--muted);
      font-size: clamp(0.9375rem, 0.88rem + 0.3vw, 1.0625rem);
      line-height: 1.6;
      letter-spacing: 0.005em;
    }

    .note {
      margin: clamp(1.5rem, 2.8vw, 2.25rem) 0 0;
      color: var(--muted-soft);
      font-size: 0.875rem;
      line-height: 1.5;
      letter-spacing: 0.005em;
    }

    ::selection {
      background: var(--ink);
      color: var(--paper);
    }

    @media (prefers-reduced-motion: no-preference) {
      .mark::before {
        animation: draw 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) 0.1s both;
      }

      .mark::after {
        animation: appear 0.9s ease 0.95s both;
      }

      h1 {
        animation: rise 1.1s cubic-bezier(0.22, 0.61, 0.36, 1) 0.3s both;
      }

      .lede {
        animation: appear 1s ease 0.6s both;
      }

      .note {
        animation: appear 1s ease 0.8s both;
      }

      .wave-1 {
        animation: drift 41s cubic-bezier(0.45, 0, 0.55, 1) -9s infinite alternate,
                   breathe 14s ease-in-out -2s infinite alternate;
      }

      .wave-2 {
        animation: drift 47s cubic-bezier(0.45, 0, 0.55, 1) -21s infinite alternate-reverse,
                   breathe 16s ease-in-out -5s infinite alternate;
      }

      .wave-3 {
        animation: drift 53s cubic-bezier(0.45, 0, 0.55, 1) -33s infinite alternate,
                   breathe-accent 18s ease-in-out -7s infinite alternate;
      }

      .wave-4 {
        animation: drift 61s cubic-bezier(0.45, 0, 0.55, 1) -45s infinite alternate-reverse,
                   breathe 20s ease-in-out -9s infinite alternate;
      }

      .wave-5 {
        animation: drift 69s cubic-bezier(0.45, 0, 0.55, 1) -57s infinite alternate,
                   breathe 22s ease-in-out -11s infinite alternate;
      }
    }

    @keyframes draw {
      from {
        transform: scaleY(0);
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(0.75rem);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
      }
    }

    @keyframes drift {
      from {
        transform: translate(-30px, 5px);
      }

      to {
        transform: translate(30px, -5px);
      }
    }

    @keyframes breathe {
      from {
        opacity: 0.5;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes breathe-accent {
      from {
        opacity: 0.6;
      }

      to {
        opacity: 1;
      }
    }

    @media (max-height: 440px) {
      main {
        transform: none;
      }

      .mark::before {
        height: 1.75rem;
      }

      h1 {
        font-size: clamp(2.25rem, 9vh, 3.5rem);
      }

      .lede {
        margin-top: 0.75rem;
      }

      .note {
        margin-top: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Decorative background waves. -->
  <div class="waves-bg" aria-hidden="true">
    <svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="waveFade" class="wave-gradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-opacity="0"/>
          <stop offset="0.25" stop-opacity="0.5"/>
          <stop offset="0.5" stop-opacity="1"/>
          <stop offset="0.75" stop-opacity="0.5"/>
          <stop offset="1" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="waveFadeAccent" class="wave-gradient-accent" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-opacity="0"/>
          <stop offset="0.25" stop-opacity="0.5"/>
          <stop offset="0.5" stop-opacity="1"/>
          <stop offset="0.75" stop-opacity="0.5"/>
          <stop offset="1" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path class="wave-1" fill="url(#waveFade)" d="M-200 120C260 40 430 210 760 120C1080 40 1300 170 1640 90L1640 245C1300 325 1080 195 760 275C430 365 260 195 -200 275Z"/>
      <path class="wave-2" fill="url(#waveFade)" d="M-200 220C250 100 450 380 800 230C1150 100 1300 280 1640 180L1640 335C1300 435 1150 255 800 385C450 535 250 255 -200 375Z"/>
      <path class="wave-3" fill="url(#waveFadeAccent)" d="M-200 730C300 600 500 870 900 700C1200 590 1350 760 1640 650L1640 805C1350 915 1200 745 900 855C500 1025 300 755 -200 885Z"/>
      <path class="wave-4" fill="url(#waveFade)" d="M-200 620C200 490 600 740 1000 560C1250 450 1400 630 1640 530L1640 685C1400 785 1250 605 1000 715C600 895 200 645 -200 775Z"/>
      <path class="wave-5" fill="url(#waveFade)" d="M-200 830C240 720 480 900 820 800C1120 710 1320 860 1640 780L1640 935C1320 1015 1120 865 820 955C480 1055 240 875 -200 985Z"/>
    </svg>
  </div>

  <div class="mark" aria-hidden="true"></div>
  <main>
    <h1>A space on the web.</h1>
    <p class="lede">This domain is not currently<br>hosting a website.</p>
    <p class="note">Please check back another time.</p>
  </main>
</body>
</html>
